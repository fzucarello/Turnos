name: Verify OSEP control panel (sin reservas)
on:
  push:
    branches: [feat/osep-private-control-panel]
  pull_request:
    paths:
      - "app.py"
      - "infrastructure/**"
      - ".github/workflows/control-panel-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax Python (sin iniciar bot)
        run: python -m compileall -q app.py infrastructure/scheduler/config_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: infrastructure/scheduler
        run: npm ci
      - name: TypeScript
        working-directory: infrastructure/scheduler
        run: npm run check
      - name: Tests
        working-directory: infrastructure/scheduler
        run: npm test
      - name: Build Worker sin desplegar
        working-directory: infrastructure/scheduler
        run: npm run build
      - name: Check admin JS syntax
        run: node --check infrastructure/admin/worker.js
