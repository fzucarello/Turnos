name: Verify OSEP bot and scheduler (sin reservas)
on:
  pull_request:
    paths:
      - "app.py"
      - "infrastructure/scheduler/**"
      - ".github/workflows/control-panel-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Python syntax (no run)
        run: python -m compileall -q app.py infrastructure/scheduler/config_snapshot.py
      - name: Python unit tests
        run: python -m unittest discover -s infrastructure/scheduler/test -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: infrastructure/scheduler
        run: npm ci
      - name: TypeScript and unit tests
        working-directory: infrastructure/scheduler
        run: |
          npm run check
          npm test
          npm run build
