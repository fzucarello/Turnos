name: Turnos OSEP (configurado en Cloudflare)
run-name: "OSEP | ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prueba sin confirmar reservas'
        type: boolean
        default: true
      request_id:
        description: 'Identificador aleatorio enviado por Cloudflare; no ingresar criterios aquí'
        type: string
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: osep-bot
      cancel-in-progress: false
    env:
      TZ: America/Argentina/Mendoza
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify private Cloudflare runtime access
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          FORCE_DRY_RUN: "${{ inputs.dry_run && 'true' || 'false' }}"
        run: python infrastructure/scheduler/run_with_credentials.py --check-only

      - name: Install deps (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers (Python CLI)
        run: |
          python -m playwright install --with-deps chromium


      - name: Random jitter (5-20s)
        run: python -c "import random,time; time.sleep(random.randint(5,20))"


      - name: Run bot
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          FORCE_DRY_RUN: "${{ inputs.dry_run && 'true' || 'false' }}"
        run: python infrastructure/scheduler/run_with_credentials.py
