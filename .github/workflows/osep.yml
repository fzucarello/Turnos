name: Turnos OSEP (cada 30 min)

on:
  workflow_dispatch:  # te permite lanzarlo a mano para probar
  schedule:
    # 05:03 a 23:53, hora Mendoza
    - cron: '3-53/10 5-23 * * *'
      timezone: 'America/Argentina/Mendoza'
  
    # 00:03 a 00:53
    - cron: '3-53/10 0 * * *'
      timezone: 'America/Argentina/Mendoza'
  
    # Última ejecución 01:03
    - cron: '3 1 * * *'
      timezone: 'America/Argentina/Mendoza'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: osep-bot
      cancel-in-progress: false
    env:
      TZ: America/Argentina/Mendoza
      PORTAL_URL: https://www.osep.mendoza.gov.ar/webapp_pri
      HEADLESS: "true"
      DRY_RUN: "false"
      TIMEOUT_MS: "25000"
      OBJ_SERVICIO: "ODONTOLOGIA INTEGRAL ADULTOS"   #"MEDICINA DE FAMILIA"
      OBJ_ZONA: "GRAN MENDOZA"
      OBJ_DEPTO: "CAPITAL"    #"GUAYMALLEN"
      OBJ_HORA_MIN: "15:00"
      OBJ_HORA_MAX: "20:00"
      OBJ_HORA_PRIORIDAD: "EARLIEST"      #"EARLIEST"
      OBJ_HORA_FLEXIBLE: "true"
      OBJ_DIA_FLEXIBLE: "true"
      OBJ_FECHA_FLEXIBLE: "false"
    # OBJ_FECHA_DISP: "07-09-2026"         #quitar el hashtag si se desea determinar una fecha en la que se quiera obtener turno

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers (Python CLI)
        run: |
          python -m playwright install --with-deps chromium


      - name: Random jitter (5-20s)
        run: python -c "import random,time; time.sleep(random.randint(5,20))"


      - name: Run bot
        env:
          OSEP_USER: ${{ secrets.OSEP_USER }}
          OSEP_PASS: ${{ secrets.OSEP_PASS }}
        run: python -u app.py
